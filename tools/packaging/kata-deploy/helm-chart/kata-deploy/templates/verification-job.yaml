{{- /*
Copyright (c) 2026 The Kata Containers Authors
SPDX-License-Identifier: Apache-2.0

Verification Job - runs after kata-deploy installation to validate Kata is working.
Only created when verification.pod is provided.
*/ -}}
{{- if .Values.verification.pod }}
{{- $isJob := eq (.Values.deploymentMode | default "daemonset") "job" }}
{{- $base := .Chart.Name }}
{{- if .Values.env.multiInstallSuffix }}{{- $base = printf "%s-%s" .Chart.Name .Values.env.multiInstallSuffix }}{{- end }}
{{- $installDispatcher := printf "%s-install-dispatcher" $base | trunc 63 | trimSuffix "-" }}
{{- $instanceMarker := include "kata-deploy.instanceMarkerLabel" . | trim }}
{{- $verificationPodPrefix := printf "%s-verify" (include "kata-deploy.fullname" .) | trunc 54 | trimSuffix "-" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kata-deploy.fullname" . }}-verification-spec
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kata-deploy.labels" . | nindent 4 }}
data:
  pod-spec.yaml: |
    {{- .Values.verification.pod | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kata-deploy.fullname" . }}-verify
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kata-deploy.labels" . | nindent 4 }}
    app.kubernetes.io/component: verification
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # In job mode the per-node install Jobs are post-install hooks at weight 5;
    # verification must run after them, so use a higher weight. In daemonset
    # mode the DaemonSet is a normal resource (created before any hook), so 0 is fine.
    "helm.sh/hook-weight": {{ if $isJob }}"10"{{ else }}"0"{{ end }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "kata-deploy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: verification
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "kata-deploy.fullname" . }}-verification
      containers:
        - name: verify
          image: {{ include "kata-deploy.kubectlImage" . }}
          command:
            - bash
            - -c
            - |
              set -e

              VERIFY_NS="{{ .Values.verification.namespace }}"
              TIMEOUT="{{ .Values.verification.timeout }}"

              echo "=== Kata Deploy Verification ==="
              echo "Namespace: ${VERIFY_NS}"
              echo "Timeout: ${TIMEOUT}s"
              echo ""

              {{- if $isJob }}
              # job mode: there is no DaemonSet. Helm has already waited for the
              # install dispatcher hook (this verification hook runs at a higher
              # weight); re-check it defensively here. The dispatcher only reports
              # success once every per-node install Job has succeeded.
              DISPATCHER="{{ $installDispatcher }}"
              INSTALL_TIMEOUT="{{ .Values.verification.daemonsetTimeout }}"
              echo "Waiting for install dispatcher Job ${DISPATCHER} to complete (timeout ${INSTALL_TIMEOUT}s)..."
              # kata-deploy restarts the CRI runtime during the cri stage, which can
              # cause transient API server unavailability. Retry the wait to handle this.
              wait_retries=5
              wait_retry_delay=15
              for wait_attempt in $(seq 1 ${wait_retries}); do
                if kubectl wait --for=condition=complete "job/${DISPATCHER}" -n {{ .Release.Namespace }} --timeout="${INSTALL_TIMEOUT}s" 2>&1; then
                  break
                fi
                if [[ ${wait_attempt} -eq ${wait_retries} ]]; then
                  echo "ERROR: install dispatcher ${DISPATCHER} did not complete after ${wait_retries} attempts"
                  kubectl get job "${DISPATCHER}" -n {{ .Release.Namespace }} || true
                  kubectl logs -n {{ .Release.Namespace }} "job/${DISPATCHER}" --tail=50 || true
                  kubectl get jobs -n {{ .Release.Namespace }} -l kata-deploy/stage=install || true
                  exit 1
                fi
                echo "API server may be restarting (attempt ${wait_attempt}/${wait_retries}), retrying in ${wait_retry_delay}s..."
                sleep ${wait_retry_delay}
              done
              {{- else }}
              # First, wait for kata-deploy DaemonSet to exist (it's created by Helm, not a hook)
              echo "Waiting for kata-deploy DaemonSet to be created..."
              {{- if .Values.env.multiInstallSuffix }}
              DAEMONSET_NAME="{{ .Chart.Name }}-{{ .Values.env.multiInstallSuffix }}"
              {{- else }}
              DAEMONSET_NAME="{{ .Chart.Name }}"
              {{- end }}

              max_wait=120
              elapsed=0
              while true; do
                if kubectl get daemonset "${DAEMONSET_NAME}" -n {{ .Release.Namespace }} &>/dev/null; then
                  echo "DaemonSet ${DAEMONSET_NAME} exists"
                  break
                fi

                if [[ ${elapsed} -ge ${max_wait} ]]; then
                  echo "ERROR: Timeout waiting for DaemonSet to be created after ${max_wait}s"
                  kubectl get daemonset -n {{ .Release.Namespace }} || true
                  exit 1
                fi

                echo "Waiting for DaemonSet to be created... (${elapsed}s/${max_wait}s)"
                sleep 2
                elapsed=$((elapsed + 2))
              done

              # Now wait for kata-deploy DaemonSet pods to exist
              echo ""
              echo "Waiting for kata-deploy DaemonSet pods to be scheduled..."
              max_wait=120
              elapsed=0
              while true; do
                pod_count=$(kubectl get pods -n {{ .Release.Namespace }} -l name=kata-deploy --no-headers 2>/dev/null | wc -l)
                if [[ ${pod_count} -gt 0 ]]; then
                  echo "Found ${pod_count} kata-deploy pod(s)"
                  break
                fi

                if [[ ${elapsed} -ge ${max_wait} ]]; then
                  echo "ERROR: Timeout waiting for kata-deploy pods after ${max_wait}s"
                  kubectl get pods -n {{ .Release.Namespace }} -l name=kata-deploy || true
                  exit 1
                fi

                echo "Waiting for pods to be scheduled... (${elapsed}s/${max_wait}s)"
                sleep 2
                elapsed=$((elapsed + 2))
              done

              # Wait for kata-deploy DaemonSet to be ready (all pods running)
              # This includes waiting for the kata-deploy image to be pulled, which can take 20+ minutes
              echo ""
              echo "Waiting for kata-deploy DaemonSet to be ready..."
              DAEMONSET_TIMEOUT="{{ .Values.verification.daemonsetTimeout }}"
              echo "DaemonSet timeout: ${DAEMONSET_TIMEOUT}s"
              # kata-deploy restarts the CRI runtime (k3s/containerd) during install,
              # which can cause transient API server unavailability. Retry to handle this.
              rollout_retries=5
              rollout_retry_delay=15
              for rollout_attempt in $(seq 1 ${rollout_retries}); do
                if kubectl rollout status daemonset/"${DAEMONSET_NAME}" -n {{ .Release.Namespace }} --timeout="${DAEMONSET_TIMEOUT}s" 2>&1; then
                  break
                fi
                if [[ ${rollout_attempt} -eq ${rollout_retries} ]]; then
                  echo "ERROR: DaemonSet rollout failed after ${rollout_retries} attempts"
                  exit 1
                fi
                echo "API server may be restarting (attempt ${rollout_attempt}/${rollout_retries}), retrying in ${rollout_retry_delay}s..."
                sleep ${rollout_retry_delay}
              done
              {{- end }}

              # Wait for nodes to be labeled with katacontainers.io/kata-runtime=true
              # This label is set by kata-deploy when installation is complete
              # This is a quick internal operation (copying artifacts), so use a fixed timeout
              echo ""
              echo "Waiting for nodes to be labeled with kata-runtime..."
              max_wait=60
              echo "Node label timeout: ${max_wait}s"
              elapsed=0
              {{- if $isJob }}
              # job mode: only the targeted nodes get labeled. The dispatcher
              # created one per-node install Job per targeted node (label
              # kata-deploy/stage=install); use that count as the expected
              # coverage rather than comparing against all nodes.
              expected_count=$(kubectl get jobs -n {{ .Release.Namespace }} -l kata-deploy/stage=install --no-headers 2>/dev/null | wc -l)
              echo "Expected ${expected_count} node(s) to be labeled (one per per-node install Job)"
              while true; do
                labeled_nodes=$(kubectl get nodes -l katacontainers.io/kata-runtime=true --no-headers 2>/dev/null | wc -l)

                if [[ ${expected_count} -gt 0 ]] && [[ ${labeled_nodes} -ge ${expected_count} ]]; then
                  echo "All ${expected_count} targeted node(s) labeled with kata-runtime=true"
                  kubectl get nodes -L katacontainers.io/kata-runtime || true
                  break
                fi

                if [[ ${elapsed} -ge ${max_wait} ]]; then
                  echo "ERROR: Timeout waiting for nodes to be labeled after ${max_wait}s"
                  echo "Labeled nodes: ${labeled_nodes}/${expected_count}"
                  echo "Node labels:"
                  kubectl get nodes -L katacontainers.io/kata-runtime || true
                  exit 1
                fi

                echo "Labeled nodes: ${labeled_nodes}/${expected_count} (${elapsed}s/${max_wait}s)"
                sleep 5
                elapsed=$((elapsed + 5))
              done
              {{- else }}
              while true; do
                labeled_nodes=$(kubectl get nodes -l katacontainers.io/kata-runtime=true --no-headers 2>/dev/null | wc -l)
                total_nodes=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)

                if [[ ${labeled_nodes} -gt 0 ]] && [[ ${labeled_nodes} -eq ${total_nodes} ]]; then
                  echo "All ${total_nodes} node(s) labeled with kata-runtime=true"
                  kubectl get nodes -L katacontainers.io/kata-runtime || true
                  break
                fi

                if [[ ${elapsed} -ge ${max_wait} ]]; then
                  echo "ERROR: Timeout waiting for nodes to be labeled after ${max_wait}s"
                  echo "Labeled nodes: ${labeled_nodes}/${total_nodes}"
                  echo "Node labels:"
                  kubectl get nodes -L katacontainers.io/kata-runtime || true
                  exit 1
                fi

                echo "Labeled nodes: ${labeled_nodes}/${total_nodes} (${elapsed}s/${max_wait}s)"
                sleep 5
                elapsed=$((elapsed + 5))
              done
              {{- end }}

              # Give kubelet time to pick up the new runtime configuration after containerd restart
              echo ""
              echo "Waiting 15s for kubelet to refresh runtime information..."
              sleep 15

              MAX_POD_RETRIES=3
              POD_RETRY_DELAY=10
              POD_NAME=""

              cleanup() {
                if [[ -n "${POD_NAME}" ]]; then
                  echo ""
                  echo "Cleaning up verification pod ${POD_NAME}..."
                  kubectl delete pod "${POD_NAME}" -n "${VERIFY_NS}" --ignore-not-found --wait=false
                fi
              }
              trap cleanup EXIT

              verify_runtime() {
                local runtime_class="$1"
                local runtime_arch="$2"
                POD_NAME="$3"
                local runtime_label="${runtime_class}"
                local patch=""
                local error_count pod_uid sandbox_error warning_events

                if [[ -n "${runtime_arch}" ]]; then
                  patch="{\"metadata\":{\"name\":\"${POD_NAME}\"},\"spec\":{\"runtimeClassName\":\"${runtime_class}\",\"nodeSelector\":{\"kubernetes.io/arch\":\"${runtime_arch}\"}}}"
                else
                  runtime_label=$(kubectl create --dry-run=client --validate=false -f /config/pod-spec.yaml -o jsonpath='{.spec.runtimeClassName}')
                  runtime_label="${runtime_label:-runtimeClassName from the supplied pod}"
                fi

                echo ""
                echo "=== Verifying RuntimeClass ${runtime_label}${runtime_arch:+ on ${runtime_arch}} ==="

                for pod_attempt in $(seq 1 "${MAX_POD_RETRIES}"); do
                  echo "Creating verification pod (attempt ${pod_attempt}/${MAX_POD_RETRIES})..."
                  kubectl delete pod "${POD_NAME}" -n "${VERIFY_NS}" --ignore-not-found --wait=true 2>/dev/null || true

                  if [[ -n "${patch}" ]]; then
                    kubectl patch --local -f /config/pod-spec.yaml --type=merge -p "${patch}" -o yaml \
                      | kubectl apply -n "${VERIFY_NS}" -f -
                  else
                    kubectl apply -n "${VERIFY_NS}" -f /config/pod-spec.yaml
                  fi
                  echo "Created: ${POD_NAME}"
                  pod_uid=$(kubectl get pod "${POD_NAME}" -n "${VERIFY_NS}" -o jsonpath='{.metadata.uid}')
                  sleep 5

                  sandbox_error=$(kubectl get events -n "${VERIFY_NS}" --field-selector involvedObject.uid="${pod_uid}",type=Warning 2>/dev/null | grep -c "FailedCreatePodSandBox" || true)
                  if [[ ${sandbox_error:-0} -gt 0 ]]; then
                    kubectl get events -n "${VERIFY_NS}" --field-selector involvedObject.uid="${pod_uid}" || true
                    if [[ ${pod_attempt} -lt ${MAX_POD_RETRIES} ]]; then
                      echo "RuntimeClass ${runtime_label}: sandbox creation failed; retrying in ${POD_RETRY_DELAY}s"
                      kubectl delete pod "${POD_NAME}" -n "${VERIFY_NS}" --ignore-not-found --wait=true 2>/dev/null || true
                      sleep "${POD_RETRY_DELAY}"
                      continue
                    fi
                    echo "ERROR: RuntimeClass ${runtime_label} could not create a sandbox"
                    kubectl describe pod "${POD_NAME}" -n "${VERIFY_NS}" || true
                    return 1
                  fi
                  break
                done

                echo "Waiting for RuntimeClass ${runtime_label} verification pod to complete..."
                start_time=$(date +%s)
                while true; do
                  phase=$(kubectl get pod "${POD_NAME}" -n "${VERIFY_NS}" -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")

                  if [[ "${phase}" == "Succeeded" ]]; then
                    echo ""
                    echo "=== RuntimeClass ${runtime_label} Verification Logs ==="
                    kubectl logs "${POD_NAME}" -n "${VERIFY_NS}" || true
                    echo "SUCCESS: RuntimeClass ${runtime_label} started a sandbox"
                    kubectl delete pod "${POD_NAME}" -n "${VERIFY_NS}" --ignore-not-found --wait=true
                    POD_NAME=""
                    return 0
                  fi

                  if [[ "${phase}" == "Failed" ]]; then
                    echo "ERROR: RuntimeClass ${runtime_label} verification pod failed"
                    kubectl describe pod "${POD_NAME}" -n "${VERIFY_NS}" || true
                    kubectl logs "${POD_NAME}" -n "${VERIFY_NS}" || true
                    return 1
                  fi

                  current_time=$(date +%s)
                  elapsed=$((current_time - start_time))
                  if [[ "${phase}" == "Pending" ]] && [[ ${elapsed} -gt 30 ]]; then
                    warning_events=$(kubectl get events -n "${VERIFY_NS}" --field-selector involvedObject.uid="${pod_uid}",type=Warning 2>/dev/null || true)
                    sandbox_error=$(echo "${warning_events}" | grep -c "FailedCreatePodSandBox" || true)
                    if [[ ${sandbox_error:-0} -gt 0 ]]; then
                      echo "ERROR: RuntimeClass ${runtime_label} could not create a sandbox"
                      echo "${warning_events}"
                      kubectl describe pod "${POD_NAME}" -n "${VERIFY_NS}" || true
                      return 1
                    fi
                    error_count=$(echo "${warning_events}" | grep -Ec "Failed|Error" || true)
                    if [[ ${error_count:-0} -gt 0 ]]; then
                      echo "ERROR: RuntimeClass ${runtime_label} verification pod is pending with warning events"
                      echo "${warning_events}"
                      kubectl describe pod "${POD_NAME}" -n "${VERIFY_NS}" || true
                      return 1
                    fi
                  fi

                  if [[ ${elapsed} -ge ${TIMEOUT} ]]; then
                    echo "ERROR: RuntimeClass ${runtime_label} verification timed out after ${TIMEOUT}s (phase=${phase})"
                    kubectl get events -n "${VERIFY_NS}" --field-selector involvedObject.uid="${pod_uid}" || true
                    kubectl describe pod "${POD_NAME}" -n "${VERIFY_NS}" || true
                    kubectl logs "${POD_NAME}" -n "${VERIFY_NS}" 2>/dev/null || echo "No logs available"
                    return 1
                  fi

                  echo "RuntimeClass ${runtime_label}: pod phase ${phase}, elapsed ${elapsed}s/${TIMEOUT}s"
                  sleep 5
                done
              }

              {{- if .Values.verification.allRuntimeClasses }}
              RUNTIME_MATRIX=(
              {{- $disableAll := .Values.shims.disableAll | default false }}
              {{- range $shimName, $shimConfig := .Values.shims }}
              {{- if ne $shimName "disableAll" }}
              {{- $shimEnabled := false }}
              {{- if eq $shimConfig.enabled true }}
              {{- $shimEnabled = true }}
              {{- else if and (ne $shimConfig.enabled false) (not $disableAll) }}
              {{- $shimEnabled = true }}
              {{- end }}
              {{- if $shimEnabled }}
              {{- range $arch := $shimConfig.supportedArches }}
                "kata-{{ $shimName }}{{ with $.Values.env.multiInstallSuffix }}-{{ . }}{{ end }}|{{ $arch }}"
              {{- end }}
              {{- end }}
              {{- end }}
              {{- end }}
              )

              runtime_index=0
              for runtime_entry in "${RUNTIME_MATRIX[@]}"; do
                runtime_class="${runtime_entry%%|*}"
                runtime_arch="${runtime_entry##*|}"
                matching_nodes=$(kubectl get nodes -l "katacontainers.io/kata-runtime=true,{{ $instanceMarker }}=true,kubernetes.io/arch=${runtime_arch}" --no-headers 2>/dev/null | wc -l)
                if [[ ${matching_nodes} -eq 0 ]]; then
                  echo "Skipping RuntimeClass ${runtime_class} on ${runtime_arch}: no installed node has that architecture"
                  continue
                fi
                runtime_index=$((runtime_index + 1))
                verify_runtime "${runtime_class}" "${runtime_arch}" "{{ $verificationPodPrefix }}-${runtime_index}"
              done
              if [[ ${runtime_index} -eq 0 ]]; then
                echo "ERROR: no enabled RuntimeClass had a matching installed node"
                exit 1
              fi
              echo "SUCCESS: verified ${runtime_index} runtime/architecture combinations"
              {{- else }}
              POD_NAME=$(kubectl create --dry-run=client --validate=false -f /config/pod-spec.yaml -o jsonpath='{.metadata.name}')
              if [[ -z "${POD_NAME}" ]]; then
                echo "ERROR: verification pod must set metadata.name"
                exit 1
              fi
              verify_runtime "" "" "${POD_NAME}"
              {{- end }}
          volumeMounts:
            - name: pod-spec
              mountPath: /config
      volumes:
        - name: pod-spec
          configMap:
            name: {{ include "kata-deploy.fullname" . }}-verification-spec
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kata-deploy.fullname" . }}-verification
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kata-deploy.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kata-deploy.fullname" . }}-verification
  labels:
    {{- include "kata-deploy.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kata-deploy.fullname" . }}-verification
  labels:
    {{- include "kata-deploy.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
subjects:
  - kind: ServiceAccount
    name: {{ include "kata-deploy.fullname" . }}-verification
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "kata-deploy.fullname" . }}-verification
  apiGroup: rbac.authorization.k8s.io
{{- end }}
